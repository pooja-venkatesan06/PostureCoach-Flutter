name: posturecoach
description: PostureCoach - Real-time posture monitoring app for ESP32 BLE device
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE communication
  flutter_blue_plus: ^1.32.12

  # State management
  provider: ^6.1.2

  # Runtime permissions (Bluetooth, Location)
  permission_handler: ^11.3.1

  # Core UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
